name: GitHub Actions security analysis

on:
  push:
    branches: [main, 'run-ci/**', '**/run-ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit GitHub Actions
    runs-on: ubuntu-latest
    permissions:
      contents: read # Inspect the checked-out workflow files.
      actions: read # Inspect referenced actions during online audits.
      security-events: write # Upload findings when public code scanning is available.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Analyze workflow security
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          persona: pedantic
          advanced-security: ${{ !github.event.repository.private }}
          annotations: ${{ github.event.repository.private }}
