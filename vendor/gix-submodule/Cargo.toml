
[package]
name = "gix-submodule"
version = "0.35.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project dealing git submodules"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/LICENSE-*"]

[lib]
doctest = false

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["gix-refspec/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["gix-refspec/sha256"]

[dependencies]
gix-pathspec = { version = "^0.21.0", git = "https://github.com/GitoxideLabs/gitoxide", rev = "1d7bac742f70b72ddda0c7294f4a97566b8db596" }
gix-error = { version = "^0.4.0", git = "https://github.com/GitoxideLabs/gitoxide", rev = "1d7bac742f70b72ddda0c7294f4a97566b8db596", features = ["bstr"] }
gix-refspec = { version = "^0.46.0", git = "https://github.com/GitoxideLabs/gitoxide", rev = "1d7bac742f70b72ddda0c7294f4a97566b8db596" }
gix-config = { version = "^0.61.0", git = "https://github.com/GitoxideLabs/gitoxide", rev = "1d7bac742f70b72ddda0c7294f4a97566b8db596" }
gix-path = { version = "^0.13.0", git = "https://github.com/GitoxideLabs/gitoxide", rev = "1d7bac742f70b72ddda0c7294f4a97566b8db596" }
gix-url = { version = "^0.39.0", git = "https://github.com/GitoxideLabs/gitoxide", rev = "1d7bac742f70b72ddda0c7294f4a97566b8db596" }

bstr = { version = "1.12.0", default-features = false }

[package.metadata.docs.rs]
features = ["sha1"]
